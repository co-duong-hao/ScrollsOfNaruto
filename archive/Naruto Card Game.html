 $('app').innerHTML=`<h1>Phòng ${R.code}</h1><div class="lob"><p>Người chơi (${pl.length}):</p><ul>${pl.map(p=>`<li>${esc(p.name)}${p.id===R.hostId?' (chủ phòng)':''}${p.id===UID?' – bạn':''}</li>`).join('')}</ul>`+
 (R.host?`<div class="row">Số bot: <select onchange="ROOM.bots=+this.value;lobby()">${[0,1,2,3,4,5].filter(k=>pl.length+k<=6).map(k=>`<option ${k==nb?'selected':''}>${k}</option>`).join('')}</select> Tổng ${tot} người ${tot>=4&&tot%2==0?'· chia 2 phe':''}</div><button class="go" ${tot<2||tot>6?'disabled':''} onclick="startOnline()">Bắt đầu</button>`:'<p>Đang chờ chủ phòng bắt đầu…</p>')+
 `<h3>Mời bạn bè</h3><ol><li>Bấm nút Chia sẻ (Share) của trang này, mời email bạn bè với quyền <b>Contributor</b> (có thể tương tác) trở lên.</li><li>Gửi họ mã phòng <b>${R.code}</b>.</li><li>Họ mở trang, chọn <b>Chơi online → Vào phòng</b> và nhập mã.</li></ol><button onclick="leave()">Thoát</button></div>`}
function startOnline(){const R=ROOM,hs=R.pl.map(p=>({uid:p.id,name:esc(p.name),bot:false})),bs=Array.from({length:R.bots},(_,i)=>({name:'Bot '+(i+1),bot:true})),all=[...hs,...bs].sort(()=>Math.random()-.5),n=all.length;if(n<2||n>6)return;
 G={online:1,host:1,seq:0,teams:n>=4&&n%2===0,ps:all.map((p,i)=>mkp(p.name,p.bot,i,p.uid)),cur:0,log:['Trận đấu bắt đầu!'],used:[],sel:null,over:null,q:[]};
 G.ps.forEach(p=>{draw(p);draw(p);draw(p)});
 subs.push(DB.collection(`rooms/${R.code}/acts`).onSnapshot(sn=>sn.docChanges().forEach(c=>{if(c.type!=='removed')handleAct(c.doc.id,c.doc.data())})));start()}
function onState(d){if(!ROOM||ROOM.host)return;
 const ps=d.ps.map(p=>({...p,hand:p.hand.map(i=>D[i])}));
 if(!G||!G.online)G={online:1,host:0,log:[],q:[],sel:null,hl:null,lastFx:0,prev:-1};
 if(d.cur!==G.prev){G.showTurn=1;G.prev=d.cur}
 const nf=d.fx&&d.fx.n!==G.lastFx?d.fx:null;if(nf)G.lastFx=nf.n;
 Object.assign(G,{ps,cur:d.cur,over:d.over,teams:d.teams,log:d.log,wait:0,seq:d.seq});
 if(nf&&(nf.cast||(nf.fl||[]).length))fxPlay(nf.cast,nf.fl||[]);else render()}
function sendAct(a){DB.doc(`rooms/${ROOM.code}/acts/${UID}`).set({n:Date.now(),a:JSON.parse(JSON.stringify(a))}).catch(()=>{G.wait=0;render()})}
function doUse(i,ti,hl){if(G.online&&!G.host){sendAct({t:'use',i,ti,hl:hl||null});G.sel=null;G.hl=null;G.wait=1;render()}else use(i,ti,hl)}
function doEnd(){if(G.online&&!G.host){sendAct({t:'end'});G.sel=null;G.hl=null;G.wait=1;render()}else{G.sel=null;G.hl=null;endT()}}
function handleAct(uid,d){if(!G||!G.host||!d||!d.a||(lastN[uid]||0)>=d.n)return;
 if(G.busy){return setTimeout(()=>handleAct(uid,d),400)}
 lastN[uid]=d.n;if(G.over)return;const s=G.ps.findIndex(p=>p.uid===uid),a=d.a;
 if(s<0||s!==G.cur||G.ps[s].bot)return;
 if(a.t==='end')return endT();
 const c=G.ps[s].hand[a.i];if(a.t!=='use'||!c||c.au)return;
 if(needT(c)){if(c.h){if(!Array.isArray(a.hl)||a.hl.length!==c.h.length||!a.hl.every(x=>valid(c,x,s)))return}else if(!valid(c,a.ti,s))return}
 use(a.i,a.ti,a.hl)}
document.addEventListener&&document.addEventListener('wheel',e=>{const h=e.target.closest&&e.target.closest('.hand');if(h&&h.scrollWidth>h.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){h.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
